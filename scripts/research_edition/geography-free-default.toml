# Geography-free default research preset
#
# An optional, study-neutral category map for ActivityWatch Research Edition.
# It is the *intersection* of two independent studies that both ran
# ActivityWatch for research:
#
#   - Ghent / ERC: a v0.13-era classify-then-redact fork, title-substring
#     allowlist, Belgian/Dutch sites.
#   - Lund / IIIEE: Research Edition v0.14.0b5-research, 17-category time-use
#     scheme, URL-then-title, Swedish + international sites.
#
# Where both studies classified the same pattern into the same family, that
# agreement is a sensible default. Where they differ, the difference is either
# folded in as an option below or left to the study as a locale/coverage pack.
#
# This is NOT a drop-in for either study, and NOT baked over the Lund taxonomy.
# It ships as a *second, optional* web-UI preset (`research-default`); the
# Research Edition build keeps the Lund `research-study` preset as its install
# default. A study that wants the geography-free default activates this preset
# (or layers a locale pack on top) and says so in its methods.
#
# Stored labels use the Lund time-use spelling.
#
# Layer on top per study:
#   - locale pack (BE/NL, SE, …)
#   - grain pack (site-level social/video)
#   - coverage pack (TikTok, Reddit, AI, Education, Sensitive)
#   - optional [aw-watcher-window.research_app_category_map]
#
# See the web-UI preset emitter: scripts/emit_research_category_preset.py

[aw-watcher-window]
research_enabled = true

[aw-watcher-window.research_app_category_map]
# Empty on purpose. Both shipped studies kept non-browser app names.
# Opt in with an app→category map if the study wants app-level categories.

[aw-watcher-window.research_category_map]
# Email
"mail.google.com" = "Email"
"outlook.office365.com" = "Email"
"mail.yahoo.com" = "Email"          # collision-safe; do not use bare yahoo.com
"yahoo mail" = "Email"
"gmail" = "Email"
"outlook" = "Email"

# Messaging (Discord is site-level in Ghent; folded here)
"web.whatsapp.com" = "Messaging"
"messenger.com" = "Messaging"
"discord.com" = "Messaging"
"whatsapp" = "Messaging"
"messenger" = "Messaging"
"discord" = "Messaging"

# Social Networking (Ghent stored Facebook/Instagram/Twitter/BeReal/Snapchat)
